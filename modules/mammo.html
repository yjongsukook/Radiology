<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mammography 판독문 생성기</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#1d2421;--mute:#66706b;--line:#d5dbd7;--acc:#1f6f5c;--warn:#a8452a}
@media(prefers-color-scheme:dark){:root{--bg:#161a18;--card:#202623;--ink:#e6ebe8;--mute:#93a09a;--line:#34403b;--acc:#58b9a0;--warn:#e08a6c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Noto Sans KR",system-ui,sans-serif}
main{max-width:1150px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media(max-width:860px){main{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 4px}h2{font-size:14px;margin:14px 0 6px}
.sub{color:var(--mute);font-size:12px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
label{font-size:12px;color:var(--mute)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px;max-width:100%}
input[type=number]{width:78px}input[type=text]{flex:1;min-width:140px}
textarea.s{width:100%;min-height:64px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.ck{display:inline-flex;gap:4px;align-items:center;color:var(--ink);font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;padding:5px 10px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.k{font-weight:600;color:var(--acc)}
#out{width:100%;min-height:480px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.x{margin-left:auto;color:var(--warn)}
/* 병변 종류별로 필요한 칸만 보이기 */
.it:not([data-kind=mass]) .g-mass{display:none}
.it:not([data-kind=calc]) .g-calc{display:none}
.it:not([data-kind=asym]) .g-asym{display:none}
.it[data-kind=ln] .g-loc,.it[data-kind=bcalc] .g-loc{display:none}
.it[data-kind=bcalc] .g-size{display:none}
.it:not([data-chg=i]):not([data-chg=d]) .g-prev{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="../lib/db.js"></script>
<script src="../lib/store.js"></script>
</head>
<body>
<main>
<section>
  <h1>Mammography 판독문 생성기</h1>
  <p class="sub">클릭 입력 → BI-RADS category 자동 제안 → 판독문 출력. 환자 정보는 입력하지 마세요. 자동 category와 문구는 반드시 직접 검수해서 사용하세요.</p>

  <details class="card" id="store"></details>

  <div class="card">
    <div class="row"><label>검사</label>
      <select id="exam"><option value="B">Bilateral</option><option value="R">Right only (unilateral)</option><option value="L">Left only (unilateral)</option></select>
      <label>Magnification view</label>
      <select id="mag"><option value="">없음</option><option value="right">Right</option><option value="left">Left</option><option value="both">Both</option></select></div>
    <div class="row"><label>수술 / 상태</label>
      <select id="post"><option value="">없음</option><option value="R">Right BCS</option><option value="L">Left BCS</option><option value="B">Both BCS</option></select>
      <label class="ck"><input type="checkbox" id="norec" checked> recurrence 소견 없음 문구</label></div>
    <div class="row"><label>Implant</label>
      <select id="imp"><option value="">없음</option><option value="B">양측</option><option value="R">Right</option><option value="L">Left</option></select></div>
    <div class="row"><label>Breast composition</label>
      <select id="comp"><option value="">(생략)</option><option value="a">a. Almost entirely fat</option><option value="b">b. Scattered fibroglandular tissue</option><option value="c" selected>c. Heterogeneous dense</option><option value="d">d. Extremely dense</option></select></div>
    <div class="row"><label>나머지 정상 문구</label>
      <select id="rest"><option value="1">넣기</option><option value="">빼기</option></select>
      <label>안내 문구</label>
      <select id="disc"><option value="auto">자동</option><option value="a">일반</option><option value="b">치밀유방</option><option value="c">우려 부위 추가검사</option><option value="d">Implant</option><option value="">빼기</option></select></div>
    <div class="row"><label>Category</label>
      <select id="cat"><option value="auto">자동 (가장 높은 병변 기준)</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4a</option><option>4b</option><option>4c</option><option>5</option><option>6</option></select>
      <span class="k" id="catShow"></span></div>
    <div class="row"><label>Rec</label><input type="text" id="rec" list="pl-rec" placeholder="비우면 자동"></div>
    <div class="row"><label>Comment</label><input type="text" id="comment" list="pl-comment" placeholder="선택"></div>
  </div>

  <h2>병변 (병변이 없으면 정상 양식으로 출력)</h2><div id="its"></div>
  <button onclick="addIt()">+ 병변 추가</button>

  <details class="card" id="xtra" style="margin-top:12px">
    <summary>기타 줄 (그대로 출력)</summary>
    <label>Findings</label><textarea id="extraF" class="s"></textarea>
    <label>Conclusion (번호는 자동)</label><textarea id="extraC" class="s"></textarea>
  </details>
</section>
<section>
  <h2 style="margin-top:0">Report</h2>
  <textarea id="out" spellcheck="false"></textarea>
  <div class="row"><button class="p" onclick="copyOut()">복사</button><span id="msg" class="sub"></span></div>
</section>
</main>
<datalist id="locs"><option>upper outer</option><option>upper inner</option><option>lower outer</option><option>lower inner</option><option>upper center</option><option>lower center</option><option>outer center</option><option>inner center</option><option>central</option><option>subareolar</option><option>axillary tail</option></datalist>
<script>
const $=id=>document.getElementById(id);
const opt=a=>a.map(v=>Array.isArray(v)?`<option value="${v[0]}">${v[1]}</option>`:`<option>${v}</option>`).join("");
const COMP={a:"Almost entirely fat.",b:"Scattered fibroglandular tissue.",c:"Heterogeneous dense, may lower the sensitivity of mammography.",d:"Extremely dense, which could obscure a lesion."};
const CAT={"0":"incomplete, need further imaging","1":"Negative mammography","2":"Benign finding(s)","3":"Probably benign finding","4a":"low suspicion for malignancy","4b":"moderate suspicion for malignancy","4c":"high suspicion for malignancy","5":"highly suggestive of malignancy","6":"Biopsy proven malignancy"};
const RANK=["1","2","3","0","4a","4b","4c","5","6"];   // 전체 category 는 이 순서로 가장 높은 것
const DISC={
  a:"유방촬영술은 조기 유방암 발견을 위해 매우 정확한 검사이나 임상적, 자가유방촉진이 병행되어야 더 정확함.",
  b:"유방촬영술은 조기 유방암 발견을 위해 매우 정확한 검사이나 유방 실질 밀도가 높으므로 임상적, 자가유방촉진이 병행되어야 함.",
  c:"환자 (또는 임상의)가 우려하는 부위가 있다면 임상의의 판단에 의한 추가 검사가 필요할 수도 있음.",
  d:"Implant로 인하여 overlap된 breast parenchyma evaluation에 제한이 있을 수 있으므로 만져지는 종괴가 있다면 초음파 등으로 evaluation 해야 함."};
const SIDE={R:"Right",L:"Left"};
// 영어 단어 뒤 조사: -tion/-ion 으로 끝나면 받침 있는 발음
const jo=(w,a,b)=>/ion$/i.test(w.trim())?a:b;

function addIt(quiet){
  const d=document.createElement("div");d.className="card it";d.dataset.kind="mass";d.dataset.chg="s";
  d.innerHTML=`<div class="row"><select data-k="kind">${opt([["mass","Mass"],["calc","Calcification (suspicious/indeterminate)"],["bcalc","Benign calcifications"],["asym","Asymmetry"],["dist","Architectural distortion"],["ln","Axillary lymph node"]])}</select>
  <select data-k="side">${opt(["Right","Left","Both"])}</select>
  <input type="text" class="g-loc" data-k="loc" list="locs" placeholder="위치 (예: upper outer)" style="flex:0 1 150px">
  <span class="g-size"><input type="number" step="0.1" min="0" data-k="size" placeholder="cm"><label> cm</label></span>
  <select data-k="chg">${opt([["s","보임 (비교 없음)"],["u","변화 없음"],["i","크기 증가"],["d","크기 감소"],["n","새로 발견"]])}</select>
  <label class="g-prev">이전</label><input type="number" step="0.1" min="0" data-k="prev" class="g-prev" placeholder="cm"><label class="g-prev">cm</label>
  <button class="x" onclick="this.closest('.card').remove();upd()">삭제</button></div>
  <div class="row g-loc"><label>Nipple로부터</label><input type="number" step="0.1" min="0" data-k="dn" placeholder="cm"><label>cm (선택)</label></div>
  <div class="row g-mass"><select data-k="shape">${opt(["oval","round","irregular"])}</select>
    <select data-k="margin">${opt([["circumscribed","circumscribed"],["obscured","obscured"],["microlobulated","microlobulated"],["indistinct","indistinct"],["spiculated","spiculated"]])}</select>
    <select data-k="dens">${opt(["equal density","high density","low density","fat-containing"])}</select></div>
  <div class="row g-calc"><select data-k="morph">${opt(["amorphous","coarse heterogeneous","fine pleomorphic","fine linear or fine-linear branching"])}</select>
    <select data-k="distr">${opt(["grouped","regional","linear","segmental","diffuse"])}</select></div>
  <div class="row g-asym"><select data-k="atype">${opt(["focal asymmetry","asymmetry","global asymmetry","developing asymmetry"])}</select></div>
  <div class="row"><label>Category</label><select data-k="cat">${opt([["auto","자동"],"2","3","0","4a","4b","4c","5","6"])}</select>
    <label class="ck"><input type="checkbox" data-k="bx">Biopsy proven malignancy</label>
    <span class="k" data-o="cat"></span></div>
  <div class="row"><input type="text" data-k="cm" placeholder="Findings 추가 문구">
    <input type="text" data-k="ro" placeholder="Conclusion 아래 --> 줄 (여러 개는 ; 로 구분)"></div>
  <div class="row"><input type="text" data-k="conc" placeholder="Conclusion 문장 직접 입력 (비우면 자동 생성)"></div>`;
  $("its").appendChild(d);if(!quiet)upd();
}
function val(c){const o={};c.querySelectorAll("[data-k]").forEach(e=>o[e.dataset.k]=e.type==="checkbox"?e.checked:e.value);return o}

// BI-RADS category 자동 제안 (ACR BI-RADS 5판 기준의 단순화) — 반드시 직접 검수
function autoCat(v){
  if(v.bx)return"6";
  switch(v.kind){
    case"bcalc":return"2";
    case"mass":
      if(v.dens==="fat-containing")return"2";
      if(v.margin==="spiculated")return v.shape==="irregular"?"5":"4c";
      if(v.shape==="irregular"||v.margin==="indistinct"||v.margin==="microlobulated")return"4b";
      if(v.chg==="i")return"4a";
      return v.chg==="u"?"2":"3";
    case"calc":{
      let c=/fine linear/.test(v.morph)?"4c":"4b";
      if((v.distr==="linear"||v.distr==="segmental")&&c==="4b")c="4c";
      return c}
    case"asym":return v.chg==="u"?"2":v.atype==="developing asymmetry"?"4a":"0";
    case"dist":return"4b";
    default:return"4a";   // axillary lymph node
  }
}

function build(v){
  const cat=v.cat==="auto"?autoCat(v):v.cat;
  const s=parseFloat(v.size)||0,p=parseFloat(v.prev)||0,sz=s?s+"cm":"";
  const chd=(v.chg==="i"||v.chg==="d")&&p>0&&s>0;
  const both=v.side==="Both",side=v.side;
  const loc=v.kind==="ln"?`${both?"양측":side} axillary area`:v.kind==="bcalc"?`${both?"양측":side} breast`:`${both?"양측":side} ${v.loc}`.trim();
  const dn=v.kind!=="ln"&&v.kind!=="bcalc"&&parseFloat(v.dn)?` nipple로부터 ${parseFloat(v.dn)}cm 거리에`:"";
  const num=chd?"":sz;   // 크기 변화가 있으면 크기는 변화 문구에 씀
  let noun,impr="",cn;
  const impression={"2":"benign으로 생각됨","3":"probably benign으로 생각됨","0":"추가 검사가 필요함","4a":"indeterminate lesion으로 생각됨","4b":"indeterminate lesion으로 생각됨","4c":"malignancy가 의심됨","5":"malignancy가 강하게 의심됨","6":""}[cat];
  if(v.kind==="mass"){
    noun=`${num?`약 ${num} 크기의 `:""}${v.shape} ${v.margin} margin 보이는 ${v.dens} mass`;
    cn=`${sz?sz+" ":""}${v.shape} mass`;
  }else if(v.kind==="calc"){
    noun=`${num?`extent는 약 ${num} 정도의 `:""}${v.distr} ${v.morph} calcification`;impr=impression;
    cn={"2":"Benign calcifications","3":"Probably benign calcifications","0":"Microcalcifications","5":"Suspicious microcalcifications","6":"Microcalcifications"}[cat]||"Indeterminate microcalcifications";
  }else if(v.kind==="bcalc"){noun="benign calcifications";cn="Benign calcifications"}
  else if(v.kind==="asym"){noun=v.atype;cn=v.atype[0].toUpperCase()+v.atype.slice(1)}
  else if(v.kind==="dist"){noun="architectural distortion";cn="Architectural distortion"}
  else{noun=`${num?`약 ${num} 크기의 `:""}enlarged lymph node`;cn=`${sz?sz+" ":""}enlarged lymph node`}

  // Findings 문장
  let f;
  if(v.chg==="n")f=`${loc}에${dn} ${noun}${jo(noun,"이","가")} 새로 발견됨${impr?", "+impr:""}.`;
  else if(v.chg==="s")f=`${loc}에${dn} ${noun}${jo(noun,"이","가")} ${impr?"있으며 "+impr:"있음"}.`;
  else if(chd)f=`${loc}에${dn} 보이던 ${noun}${jo(noun,"은","는")} ${p}cm에서 ${s}cm으로 크기 ${v.chg==="i"?"증가":"감소"}함.`;
  else f=`${loc}에${dn} 보이던 ${noun}${jo(noun,"은","는")} 변화 없음.`;
  if(v.bx)f+=" 외부에서 biopsy 시행하여 malignancy로 확인되었다고 함.";
  if(v.cm)f+=" "+v.cm;

  // Conclusion 문장
  const where=v.kind==="ln"?`${both?"both":side.toLowerCase()} axilla`:v.kind==="bcalc"?`in ${both?"both breasts":side.toLowerCase()+" breast"}`:`${both?"both":side.toLowerCase()} ${v.loc}`.trim();
  const sep=v.kind==="bcalc"?" ":", ";
  const art=v.kind==="mass"||v.kind==="ln"?(/^[aeiou8]/i.test(cn)?"an ":"a "):"";
  const pre={s:"",u:"No change of ",n:"New ",i:"Interval increase in size of ",d:"Interval decrease in size of "}[v.chg];
  if(pre)cn=cn[0].toLowerCase()+cn.slice(1);
  let c=pre+(v.chg==="n"?"":art)+cn+sep+where+(chd?` (${p}cm -> ${s}cm)`:"")+".";
  c=c[0].toUpperCase()+c.slice(1);
  if(v.conc&&v.conc.trim())c=v.conc.trim();
  if(v.bx)c+="\n --> Biopsy proven malignancy.";
  if(v.ro)c+=v.ro.split(/\s*;\s*/).filter(Boolean).map(x=>"\n --> "+x).join("");
  return{f,c,cat};
}

function upd(){
  const its=[...document.querySelectorAll(".it")].map(c=>{const v=val(c);c.dataset.kind=v.kind;c.dataset.chg=v.chg;const b=build(v);
    c.querySelector("[data-o=cat]").textContent=`→ Category ${b.cat}`;return b});
  const exam=$("exam").value,post=$("post").value,imp=$("imp").value,comp=$("comp").value;
  const lines=id=>$(id).value.split("\n").map(s=>s.trim()).filter(Boolean);
  const xf=lines("extraF"),xc=lines("extraC");
  const F=[],C=[];

  if(imp)F.push(imp==="B"?"양측에 breast implant가 삽입되어 있음.":`${SIDE[imp]} breast에 breast implant가 삽입되어 있음.`);
  const postSides=post==="B"?["Right","Left"]:post?[SIDE[post]]:[];
  postSides.forEach(sd=>F.push(`${sd} breast에 postoperative change 가 관찰${$("norec").checked?"되며 Local recurrence를 시사하는 소견은 뚜렷하지 않음.":"됨."}`));
  its.forEach(b=>F.push(b.f));
  xf.forEach(t=>F.push(t));
  const any=its.length||xf.length||post||imp;
  if($("rest").value){
    if(exam!=="B"){const sd=SIDE[exam];
      if(!its.length&&!xf.length&&!post)F.push(`${sd} breast 에 mass 나 abnormal calcification 없음.`,`${sd} axillary area 에 abnormal lymph node enlargement 없음.`);
      else F.push(`그 외 ${sd} breast와 axillary area에 뚜렷한 이상소견 없음.`);
    }else if(!any)F.push("유방과 액와부에 뚜렷한 이상소견 없음.");
    else if(imp&&!its.length&&!xf.length&&!post)F.push("Visualized parenchyma 내에 mass나 calcification 없음.");
    else F.push("그 외의 유방과 액와부에 뚜렷한 이상소견 없음.");
  }

  if(post)C.push($("norec").checked?"Postoperative breast with no evidence of recurrence.":"Postoperative breast.");
  if(imp)C.push("Implanted breast.");
  its.forEach(b=>C.push(b.c));
  xc.forEach(t=>C.push(t));
  if(!its.length&&!xc.length){
    if(!post&&!imp)C.push("정상 유방촬영술.");
    else if(imp&&!post)C.push("No evidence of malignancy.");
  }
  const concl=C.length>1?"Conclusion :\n"+C.map((t,i)=>`${i+1}. ${t}`).join("\n"):"Conclusion : "+C[0];

  // 전체 category: 병변 중 가장 높은 것, 병변이 없으면 1 (수술 후·implant 정상도 1)
  let K=$("cat").value;
  if(K==="auto"){const ks=its.map(b=>b.cat);K=ks.length?ks.reduce((a,b)=>RANK.indexOf(b)>RANK.indexOf(a)?b:a):"1"}
  $("catShow").textContent=$("cat").value==="auto"?`→ ${K}`:"";
  const dense=comp==="c"||comp==="d";
  const autoRec={"0":"USG for further evaluation.","3":"Short-term follow-up mammography (6 months).","4a":"USG and pathologic confirmation.","4b":"USG and pathologic confirmation.","4c":"USG and pathologic confirmation.","5":"USG and pathologic confirmation.","6":""}[K]
    ??(dense?"치밀유방으로 병변이 가려져 발견이 안 될수 있으므로 초음파 검사를 권유.":"정기적 진찰");
  $("rec").placeholder="비우면 자동: "+(autoRec||"(없음)");
  const rec=$("rec").value.trim()||autoRec;
  let dk=$("disc").value;
  if(dk==="auto")dk=imp?"d":dense?"b":post?"c":"a";
  const disc=dk?DISC[dk]:"";

  const head=($("mag").value?`<Mammography와 ${$("mag").value} magnification view를 함께 판독함>`:"<Mammography>")+(exam!=="B"?"\nMAMMOGRAPHY (UNILATERAL)":"");
  $("out").value=`${head}
${comp?`\nBreast Composition (유방실질분포) : ${COMP[comp]}\n`:""}
Findings :
${F.join("\n")}
${disc?"\n"+disc+"\n":""}
====== [Conclusion] ======
<Mammography>
${concl}

Category : ${K} (${CAT[K]})${rec?`\n\nRecommendation : ${rec}`:""}${$("comment").value?`\n\nComment : ${$("comment").value}`:""}`;
}

function copyOut(){
  const t=$("out");t.select();
  (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>document.execCommand("copy"));
  $("msg").textContent="복사됨";setTimeout(()=>$("msg").textContent="",1500);
}
// 판독문 칸을 직접 고칠 때는 다시 생성하지 않음 (입력 칸을 바꾸면 다시 생성됨)
const skip=e=>e.target.id==="out"||(e.target.closest&&e.target.closest("#store"));
document.addEventListener("input",e=>{if(!skip(e))upd()});
document.addEventListener("change",e=>{if(!skip(e))upd()});
upd();

Store.init({module:"mammo",out:"out",fields:{rec:"Rec",comment:"Comment"},
  onUse:body=>{$("out").value=body;$("msg").textContent="저장된 판독문을 불러왔어요. 위쪽 입력 칸을 바꾸면 입력값 기준으로 다시 만들어져요."}});
</script>
</body>
</html>
