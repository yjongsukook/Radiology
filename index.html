<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radiology Report Studio</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#1d2421;--mute:#66706b;--line:#d5dbd7;--acc:#1f6f5c;--accbg:#e3f0ec}
@media(prefers-color-scheme:dark){:root{--bg:#161a18;--card:#202623;--ink:#e6ebe8;--mute:#93a09a;--line:#34403b;--acc:#58b9a0;--accbg:#1f3530}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Noto Sans KR",system-ui,sans-serif;display:grid;grid-template-columns:220px 1fr;grid-template-rows:100%}
nav{background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px}
.brand{font-weight:700;font-size:15px;padding:0 8px 2px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.grp{margin:16px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--mute);text-transform:uppercase}
nav a,nav span.off{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:5px;text-decoration:none;color:var(--ink)}
nav a:hover{background:var(--bg)}
nav a[aria-current=page]{background:var(--accbg);color:var(--acc);font-weight:600}
nav span.off{color:var(--mute);cursor:default}
.tag{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--mute);font-weight:400}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.foot{margin:20px 8px 0;font-size:11px;color:var(--mute)}
.acct{margin:16px 8px 0;padding-top:12px;border-top:1px solid var(--line);font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acct .em{word-break:break-all;width:100%}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;padding:4px 10px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.6;cursor:default}
.acct button{padding:3px 10px}
#main{position:relative;min-width:0;overflow:auto}
#view{width:100%;height:100%;border:0;display:block;background:var(--bg)}
#auth{display:flex;justify-content:center;padding:48px 16px}
#auth[hidden],#view[hidden],.box input[hidden],.tabs[hidden]{display:none}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px}
.box h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--mute);font-size:12px;margin:0 0 12px}
.tabs{display:flex;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 12px;color:var(--mute)}
.tabs button[aria-selected=true]{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
.box input{display:block;width:100%;margin-bottom:8px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 8px}
.box button.p{width:100%;padding:8px}
.err{color:#c0543a;font-size:12px;margin-top:8px;min-height:1em}
.ok{color:var(--acc);font-size:13px;margin-top:8px}
#menu{display:none}
@media(max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #menu{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  #menu button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:4px 10px}
  nav{display:none;position:fixed;inset:45px 0 0 0;z-index:5;border-right:0}
  body.open nav{display:block}
}
</style>
</head>
<body>
<div id="menu"><button onclick="document.body.classList.toggle('open')">메뉴</button><b id="cur"></b></div>
<nav id="nav"></nav>
<div id="main">
  <iframe id="view" title="판독문 생성기" allow="clipboard-write" hidden></iframe>
  <section id="auth" hidden>
    <div class="box">
      <h1 id="atitle">로그인</h1>
      <p class="sub" id="anote">판독지는 로그인 후 사용할 수 있어요.</p>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-mode="login">로그인</button>
        <button type="button" role="tab" data-mode="signup">회원가입</button>
        <button type="button" role="tab" data-mode="forgot">비밀번호 찾기</button>
      </div>
      <form id="aform">
        <input type="email" id="aem" placeholder="이메일" autocomplete="username" required>
        <input type="password" id="apw" placeholder="비밀번호" minlength="6" required>
        <input type="password" id="apw2" placeholder="비밀번호 확인">
        <button class="p" id="asub">로그인</button>
        <div class="err" id="aerr"></div>
      </form>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="lib/db.js"></script>
<script>
// 새 판독지 추가: modules/ 폴더에 html 파일을 넣고 아래 목록에 file 경로를 적으면 활성화됨
const MODULES=[
  {grp:"Ultrasound",items:[
    {id:"thyroid-us",name:"갑상선 초음파",file:"modules/thyroid-us.html"},
    {id:"breast-us",name:"유방 초음파"},
    {id:"msk-us",name:"근골격계 초음파"},
    {id:"abd-us",name:"복부 초음파"}]},
  {grp:"Mammography",items:[
    {id:"mammo",name:"Mammography",file:"modules/mammo.html"}]},
  {grp:"X-ray",items:[
    {id:"chest-xr",name:"흉부 X-ray"}]},
  {grp:"CT",items:[
    {id:"abd-ct",name:"복부 CT"}]},
  {grp:"MRI",items:[
    {id:"mri",name:"MRI"}]},
  {grp:"Community",items:[
    {id:"guestbook",name:"방명록",file:"modules/guestbook.html",open:true}]}
];
// open:true 인 메뉴는 로그인 없이 사용 가능. 나머지(판독지)는 로그인해야 열림
const all=MODULES.flatMap(g=>g.items),ready=all.filter(m=>m.file);
document.getElementById("nav").innerHTML=
  `<div class="brand">판독지 스튜디오<small>Radiology report generator</small></div>`+
  MODULES.map(g=>`<div class="grp">${g.grp}</div>`+g.items.map(m=>m.file
    ?`<a href="#${m.id}" data-id="${m.id}">${m.name}</a>`
    :`<span class="off">${m.name}<span class="tag">준비 중</span></span>`).join("")).join("")+
  `<div class="acct" id="acct"></div><div class="foot">환자 식별 정보는 입력하지 마세요.</div>`;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let uid,email="";   // uid: undefined = 아직 확인 전, null = 로그아웃 상태

// 회원가입 임시 중지. 다시 열려면 true 로 바꾸고, Supabase 의 "Allow new users to sign up" 도 켜기
const SIGNUP_OPEN=false;
if(!SIGNUP_OPEN)document.querySelector('.tabs [data-mode=signup]').remove();

function renderAcct(){
  const el=$("acct");
  if(!window.RDB){el.textContent="저장소에 연결할 수 없어요 (인터넷 확인)";return}
  el.innerHTML=uid
    ?`<div class="em">${esc(email)}</div><button id="out">로그아웃</button>`
    :`<button class="p" onclick="location.hash='#login'">로그인</button>`+(SIGNUP_OPEN?`<button onclick="location.hash='#signup'">회원가입</button>`:"");
  if(uid)$("out").onclick=()=>RDB.signOut();
}

/* ---------- 로그인 / 회원가입 / 비밀번호 찾기 화면 ---------- */
// login: 로그인, signup: 회원가입, forgot: 재설정 메일 보내기, newpw: 메일 링크로 들어와 새 비밀번호 정하기
const MODES={
  login: {title:"로그인",     btn:"로그인",              em:1,pw:"비밀번호"},
  signup:{title:"회원가입",   btn:"가입하기",            em:1,pw:"비밀번호 (6자 이상)",pw2:1},
  forgot:{title:"비밀번호 찾기",btn:"재설정 메일 보내기", em:1},
  newpw: {title:"새 비밀번호 설정",btn:"비밀번호 변경",  pw:"새 비밀번호 (6자 이상)",pw2:1}
};
let mode="login",recovering=false;
function setMode(m){
  mode=m;const c=MODES[m];
  $("atitle").textContent=c.title;
  document.querySelector(".tabs").hidden=m==="newpw";
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===m));
  $("aem").hidden=!c.em;$("aem").required=!!c.em;
  $("apw").hidden=!c.pw;$("apw").required=!!c.pw;$("apw").placeholder=c.pw||"";
  $("apw").autocomplete=m==="login"?"current-password":"new-password";
  $("apw2").hidden=!c.pw2;$("apw2").required=!!c.pw2;
  $("asub").textContent=c.btn;
  $("aerr").textContent="";$("aerr").className="err";
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
const KO={
  "Invalid login credentials":"이메일 또는 비밀번호가 틀려요.",
  "Email not confirmed":"메일 인증이 아직 안 됐어요. 받은 메일의 링크를 먼저 눌러 주세요.",
  "User already registered":"이미 가입된 이메일이에요. 로그인해 주세요.",
  "Signups not allowed for this instance":"지금은 회원가입이 막혀 있어요. (Supabase 설정에서 허용 필요)",
  "New password should be different from the old password.":"이전과 다른 비밀번호로 정해 주세요.",
  "Auth session missing!":"링크가 만료됐어요. 비밀번호 찾기를 다시 해 주세요."
};
const koErr=x=>KO[x.message]||(/password/i.test(x.message)&&/least|short|weak/i.test(x.message)?"비밀번호가 너무 짧거나 쉬워요. 더 길게 만들어 주세요.":/rate limit|security purposes/i.test(x.message)?"요청이 너무 많아요. 잠시 후 다시 시도해 주세요.":x.message);
const ok=t=>{$("aerr").className="ok";$("aerr").textContent=t};
$("aform").onsubmit=async e=>{
  e.preventDefault();
  const em=$("aem").value.trim(),pw=$("apw").value,msg=$("aerr");
  msg.className="err";msg.textContent="";
  if(MODES[mode].pw2&&pw!==$("apw2").value){msg.textContent="비밀번호 확인이 달라요.";return}
  $("asub").disabled=true;
  try{
    if(mode==="login"){await RDB.signIn(em,pw);return}
    if(mode==="forgot"){
      await RDB.resetPassword(em);
      ok(`${em} 로 비밀번호 재설정 메일을 보냈어요. 메일의 링크를 눌러 새 비밀번호를 정하세요. (가입된 이메일일 때만 메일이 가요)`);return}
    if(mode==="newpw"){
      await RDB.updatePassword(pw);
      recovering=false;$("apw").value="";$("apw2").value="";route();
      if(!$("view").hidden)return;
      ok("비밀번호를 바꿨어요.");return}
    const d=await RDB.signUp(em,pw);
    if(d.session)return;   // 메일 인증이 꺼져 있으면 바로 로그인됨
    if(d.user&&d.user.identities&&!d.user.identities.length){msg.textContent=KO["User already registered"];return}
    setMode("login");$("apw").value="";$("apw2").value="";
    ok(`${em} 로 인증 메일을 보냈어요. 메일의 링크를 누른 뒤 여기서 로그인하세요.`);
  }catch(x){msg.textContent=koErr(x)}
  finally{$("asub").disabled=false}
};

// 만료되거나 이미 쓴 메일 링크로 들어오면 주소 뒤에 #error_code=... 가 붙어 옴
let linkErr="";
if(/error_code=/.test(location.hash)){
  const p=new URLSearchParams(location.hash.slice(1));
  linkErr=p.get("error_code")==="otp_expired"?"메일 링크가 만료됐거나 이미 사용됐어요. 다시 요청해 주세요.":"메일 링크를 처리하지 못했어요: "+(p.get("error_description")||p.get("error_code"));
  history.replaceState(null,"",location.pathname+location.search);
}

/* ---------- 화면 전환 ---------- */
function route(){
  const h=location.hash,authPage=h==="#login"||h==="#signup";
  const m=authPage?null:ready.find(x=>"#"+x.id===h)||ready[0];
  document.querySelectorAll("nav a").forEach(a=>m&&a.dataset.id===m.id?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  const name=recovering?"새 비밀번호 설정":m?m.name:h==="#signup"&&SIGNUP_OPEN?"회원가입":"로그인";
  $("cur").textContent=name;document.title=name+" · 판독지 스튜디오";
  document.body.classList.remove("open");
  if(uid===undefined)return;   // 로그인 상태 확인 후 다시 불림
  const f=$("view");
  if(recovering){   // 비밀번호 재설정 메일 링크로 들어옴: 새 비밀번호부터 정하게 함
    $("auth").hidden=false;f.hidden=true;f.removeAttribute("src");
    setMode("newpw");$("anote").textContent="새로 사용할 비밀번호를 입력하세요.";return}
  if(authPage&&uid){location.replace("#"+ready[0].id);return}
  const lock=authPage||(!m.open&&!uid);
  $("auth").hidden=!lock;f.hidden=lock;
  if(lock){
    f.removeAttribute("src");   // 로그아웃하면 판독지 화면을 내림
    setMode(h==="#signup"&&SIGNUP_OPEN?"signup":"login");
    $("anote").textContent=authPage?"로그인하면 판독지를 사용할 수 있어요.":`${m.name} 판독지는 로그인 후 사용할 수 있어요.`;
    if(linkErr){$("aerr").textContent=linkErr;linkErr=""}
  }else if(f.getAttribute("src")!==m.file)f.src=m.file;
}

// SIGNED_IN 은 실제 로그인 말고도(탭 전환, 판독지 화면의 세션 복구 등) 반복해서 오므로
// 로그인한 사용자가 실제로 바뀔 때만 화면을 갱신함 (안 그러면 새로고침이 무한 반복됨)
if(window.RDB)RDB.sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==="PASSWORD_RECOVERY"&&!recovering){recovering=true;setTimeout(route,0)}
  if(ev==="SIGNED_OUT")recovering=false;
  const u=s?s.user.id:null;if(u===uid)return;
  const first=uid===undefined;uid=u;email=s?s.user.email:"";
  setTimeout(()=>{
    renderAcct();
    const f=$("view"),was=f.getAttribute("src");
    route();
    if(!first&&was&&was===f.getAttribute("src"))f.src=was;   // 방명록처럼 열려 있던 화면은 새 로그인 상태로 다시 불러옴
  },0);
});
else{uid=null;renderAcct()}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
