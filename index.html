<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radiology Report Studio</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#1d2421;--mute:#66706b;--line:#d5dbd7;--acc:#1f6f5c;--accbg:#e3f0ec}
@media(prefers-color-scheme:dark){:root{--bg:#161a18;--card:#202623;--ink:#e6ebe8;--mute:#93a09a;--line:#34403b;--acc:#58b9a0;--accbg:#1f3530}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Noto Sans KR",system-ui,sans-serif;display:grid;grid-template-columns:220px 1fr;grid-template-rows:100%}
nav{background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px}
.brand{font-weight:700;font-size:15px;padding:0 8px 2px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.grp{margin:16px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--mute);text-transform:uppercase}
nav a,nav span.off{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:5px;text-decoration:none;color:var(--ink)}
nav a:hover{background:var(--bg)}
nav a[aria-current=page]{background:var(--accbg);color:var(--acc);font-weight:600}
nav span.off{color:var(--mute);cursor:default}
.tag{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--mute);font-weight:400}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.foot{margin:20px 8px 0;font-size:11px;color:var(--mute)}
.acct{margin:16px 8px 0;padding-top:12px;border-top:1px solid var(--line);font-size:12px}
.acct input{width:100%;margin-bottom:4px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px}
.acct button{font:inherit;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:4px;padding:3px 10px}
.acct button.o{background:none;color:var(--ink);border-color:var(--line)}
.acct .em{word-break:break-all;margin-bottom:4px}
.acct .err{color:#c0543a;margin-top:4px}
#view{width:100%;height:100%;border:0;display:block;background:var(--bg)}
#menu{display:none}
@media(max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #menu{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  #menu button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:4px 10px}
  nav{display:none;position:fixed;inset:45px 0 0 0;z-index:5;border-right:0}
  body.open nav{display:block}
}
</style>
</head>
<body>
<div id="menu"><button onclick="document.body.classList.toggle('open')">메뉴</button><b id="cur"></b></div>
<nav id="nav"></nav>
<iframe id="view" title="판독문 생성기" allow="clipboard-write"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="lib/db.js"></script>
<script>
// 새 판독지 추가: modules/ 폴더에 html 파일을 넣고 아래 목록에 file 경로를 적으면 활성화됨
const MODULES=[
  {grp:"Ultrasound",items:[
    {id:"thyroid-us",name:"갑상선 초음파",file:"modules/thyroid-us.html"},
    {id:"breast-us",name:"유방 초음파"},
    {id:"msk-us",name:"근골격계 초음파"},
    {id:"abd-us",name:"복부 초음파"}]},
  {grp:"X-ray",items:[
    {id:"chest-xr",name:"흉부 X-ray"}]},
  {grp:"CT",items:[
    {id:"abd-ct",name:"복부 CT"}]},
  {grp:"MRI",items:[
    {id:"mri",name:"MRI"}]}
];
const all=MODULES.flatMap(g=>g.items),ready=all.filter(m=>m.file);
document.getElementById("nav").innerHTML=
  `<div class="brand">판독지 스튜디오<small>Radiology report generator</small></div>`+
  MODULES.map(g=>`<div class="grp">${g.grp}</div>`+g.items.map(m=>m.file
    ?`<a href="#${m.id}" data-id="${m.id}">${m.name}</a>`
    :`<span class="off">${m.name}<span class="tag">준비 중</span></span>`).join("")).join("")+
  `<div class="acct" id="acct"></div><div class="foot">환자 식별 정보는 입력하지 마세요.</div>`;

// 로그인 (계정은 Supabase 대시보드 > Authentication > Users 에서 만듦)
async function renderAcct(){
  const el=document.getElementById("acct");
  if(!window.RDB){el.textContent="저장소에 연결할 수 없어요 (인터넷 확인)";return}
  const u=await RDB.user();
  el.innerHTML=u
    ?`<div class="em">${u.email}</div><button class="o" id="out">로그아웃</button>`
    :`<form id="login"><input type="email" id="em" placeholder="이메일" autocomplete="username" required><input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" required><button>로그인</button><div class="err" id="err"></div></form>`;
  if(u)document.getElementById("out").onclick=()=>RDB.signOut();
  else document.getElementById("login").onsubmit=async e=>{e.preventDefault();
    try{await RDB.signIn(em.value.trim(),pw.value)}catch(x){err.textContent=x.message==="Invalid login credentials"?"이메일 또는 비밀번호가 틀려요":x.message}};
}
// SIGNED_IN 은 실제 로그인 말고도(탭 전환, 판독지 화면의 세션 복구 등) 반복해서 오므로
// 로그인한 사용자가 실제로 바뀔 때만 판독지 화면을 다시 불러옴 (안 그러면 새로고침이 무한 반복됨)
let uid;
if(window.RDB)RDB.sb.auth.onAuthStateChange((ev,s)=>{
  const u=s?s.user.id:null;if(u===uid)return;
  const first=uid===undefined;uid=u;
  setTimeout(()=>{renderAcct();if(!first){const f=document.getElementById("view");f.src=f.getAttribute("src")}},0);
});
renderAcct();
function route(){
  const m=ready.find(x=>"#"+x.id===location.hash)||ready[0];
  const f=document.getElementById("view");
  if(f.getAttribute("src")!==m.file)f.src=m.file;
  document.querySelectorAll("nav a").forEach(a=>a.dataset.id===m.id?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  document.getElementById("cur").textContent=m.name;
  document.title=m.name+" · 판독지 스튜디오";
  document.body.classList.remove("open");
}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
